<style>
:root{
  --bg:#0d0f18;
  --surface:#171b28;
  --surface2:#202536;
  --border:#343b53;
  --text:#f5f6fb;
  --muted:#9da5b9;
  --pink:#e74ca9;
  --purple:#7657ed;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(118,87,237,.08),transparent 30%),
    var(--bg);
  color:var(--text);
}
a{color:inherit;text-decoration:none}
.wrap{width:min(1000px,calc(100% - 24px));margin:auto}

header{
  background:#0b0d15;
  border-bottom:1px solid #242a3c;
}
.header{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:linear-gradient(135deg,#f2a53b,var(--pink) 48%,var(--purple));
  font-size:12px;
}
.back{
  padding:10px 14px;
  border:1px solid #3a4159;
  border-radius:7px;
  background:#252a3c;
  font-size:12px;
  font-weight:800;
}

.hero{
  margin:24px auto 18px;
  padding:24px;
  border:1px solid var(--border);
  border-radius:10px;
  background:
    linear-gradient(110deg,rgba(231,76,169,.11),rgba(118,87,237,.08) 48%,transparent 80%),
    var(--surface);
}
.hero h1{margin:0 0 8px;font-size:30px}
.hero p{margin:0;color:var(--muted);line-height:1.65;font-size:13px}

.content{
  margin-bottom:40px;
  padding:26px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
}
.content h2{
  margin:30px 0 10px;
  padding-bottom:8px;
  border-bottom:1px solid #353c56;
  font-size:19px;
}
.content h2:first-child{margin-top:0}
.content p,.content li{
  color:#d8dce7;
  font-size:13px;
  line-height:1.75;
}
.content ul{padding-left:20px}
.note{
  margin:18px 0;
  padding:14px;
  border:1px solid #514b8e;
  border-radius:7px;
  background:rgba(118,87,237,.08);
  color:#dfe2eb;
  font-size:12px;
  line-height:1.65;
}

.legal-nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:28px;
}
.legal-nav a{
  padding:9px 11px;
  border:1px solid #353c54;
  border-radius:6px;
  background:var(--surface2);
  color:#d9dce6;
  font-size:11px;
}

footer{
  padding:24px 0 36px;
  border-top:1px solid #292f43;
  color:#81899d;
  font-size:10px;
}

@media(max-width:600px){
  .header{min-height:64px}
  .brand{font-size:20px}
  .hero{padding:19px}
  .hero h1{font-size:25px}
  .content{padding:19px}
  .content h2{font-size:17px}
  .content p,.content li{font-size:12.5px}
}
</style>

<main class="wrap content">

  <h2>1. Introducción</h2>
  <p>
    NightInk Comics ("NightInk", "el sitio", "nosotros") respeta la privacidad de sus visitantes.
    Esta Política de Privacidad explica qué información puede ser tratada cuando una persona visita o utiliza NightInk.
  </p>

  <div class="note">
    NightInk es un sitio destinado exclusivamente a personas adultas. Al acceder al sitio, el visitante confirma que cumple la edad legal aplicable en su jurisdicción.
  </div>

  <h2>2. Información que podemos tratar</h2>
  <p>Dependiendo de cómo se utilice el sitio, podemos tratar información técnica como:</p>
  <ul>
    <li>Dirección IP.</li>
    <li>Tipo de navegador y dispositivo.</li>
    <li>Sistema operativo.</li>
    <li>Páginas visitadas y tiempo aproximado de navegación.</li>
    <li>Fecha y hora de acceso.</li>
    <li>Información técnica necesaria para seguridad, prevención de abuso y funcionamiento del sitio.</li>
  </ul>

  <p>
    NightInk no requiere actualmente que los visitantes creen una cuenta para leer el catálogo público.
  </p>

  <h2>3. Verificación de edad</h2>
  <p>
    El sitio puede guardar en el navegador una preferencia local que indica que el visitante confirmó ser mayor de edad.
    Esta información se almacena mediante tecnologías del navegador, como localStorage, y se utiliza para evitar mostrar repetidamente el aviso de edad.
  </p>

  <h2>4. Cookies y almacenamiento local</h2>
  <p>
    NightInk puede utilizar cookies, almacenamiento local u otras tecnologías similares para recordar preferencias,
    mantener funciones esenciales, mejorar la experiencia y medir el funcionamiento del sitio.
  </p>
  <p>
    Si en el futuro incorporamos servicios de analítica o publicidad, esos proveedores podrán utilizar cookies u otras tecnologías conforme a sus propias políticas y a los requisitos legales aplicables.
  </p>

  <h2>5. Publicidad</h2>
  <p>
    NightInk puede mostrar publicidad de terceros. Los proveedores de publicidad pueden recopilar información técnica
    sobre el dispositivo, navegador, interacción con anuncios y otras señales permitidas por la legislación aplicable.
  </p>
  <p>
    Cuando se incorporen proveedores publicitarios, NightInk procurará utilizar redes que permitan contenido para adultos y ofrecer los avisos o controles de consentimiento que resulten necesarios.
  </p>

  <h2>6. Analítica y métricas</h2>
  <p>
    Podemos utilizar métricas agregadas para comprender qué contenido es más visitado, detectar errores,
    mejorar el rendimiento y proteger el sitio contra abuso.
  </p>

  <h2>7. Información enviada voluntariamente</h2>
  <p>
    Si un visitante utiliza posteriormente un formulario de contacto, reporte o solicitud legal,
    podremos tratar la información que proporcione voluntariamente, como nombre, dirección de correo electrónico,
    descripción del problema y documentación adjunta.
  </p>

  <h2>8. Finalidades del tratamiento</h2>
  <p>La información puede utilizarse para:</p>
  <ul>
    <li>Operar y mantener NightInk.</li>
    <li>Proteger el sitio frente a fraude, abuso o ataques.</li>
    <li>Corregir errores técnicos.</li>
    <li>Medir el rendimiento del contenido.</li>
    <li>Responder a comunicaciones, reportes o solicitudes legales.</li>
    <li>Cumplir obligaciones legales cuando sean aplicables.</li>
  </ul>

  <h2>9. Terceros</h2>
  <p>
    NightInk puede depender de proveedores externos de infraestructura, almacenamiento, seguridad,
    distribución de contenido, analítica o publicidad. Estos proveedores pueden tratar determinados datos técnicos
    necesarios para prestar sus servicios.
  </p>

  <h2>10. Conservación</h2>
  <p>
    La información se conservará únicamente durante el tiempo razonablemente necesario para las finalidades descritas,
    para proteger la seguridad del servicio o para cumplir obligaciones legales.
  </p>

  <h2>11. Seguridad</h2>
  <p>
    Aplicamos medidas técnicas y organizativas razonables para proteger el servicio y la información tratada.
    Sin embargo, ningún sistema conectado a Internet puede garantizar seguridad absoluta.
  </p>

  <h2>12. Menores de edad</h2>
  <p>
    NightInk no está dirigido a menores. No pretendemos recopilar conscientemente información personal de menores de edad.
    Si recibimos información creíble de que un menor ha proporcionado datos personales a través del sitio,
    podremos tomar medidas para eliminarlos cuando corresponda.
  </p>

  <h2>13. Derechos de privacidad</h2>
  <p>
    Dependiendo del país o región del visitante, pueden existir derechos relacionados con acceso,
    corrección, eliminación, oposición, limitación o portabilidad de determinados datos personales.
    Las solicitudes podrán presentarse a través del canal de contacto legal que NightInk habilite.
  </p>

  <h2>14. Enlaces externos</h2>
  <p>
    NightInk puede contener enlaces a sitios o servicios externos. No controlamos sus prácticas de privacidad
    y recomendamos revisar sus propias políticas antes de proporcionar información.
  </p>

  <h2>15. Cambios en esta política</h2>
  <p>
    Esta Política de Privacidad podrá actualizarse cuando cambien las funciones de NightInk,
    sus proveedores o los requisitos legales aplicables. La versión publicada en esta página será la vigente.
  </p>

  <h2>16. Contacto y solicitudes</h2>

    NightInk habilitará un canal específico para consultas de privacidad, reportes y solicitudes legales.
    Una vez activado, estará disponible desde la sección de Contacto del sitio.
  </p>
