name = "nightink-app"
main = "src/index.js"
compatibility_date = "2026-08-18"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nightink-db"
database_id = "7c0a582e-12ed-4cbb-addb-565f9206b9d4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nightink-media"
